<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Auditorías 5S · GLP S.A.</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2027">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Auditorías 5S">

<!-- Generación de PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<!-- Exportar historial a Excel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Gráficos de seguimiento -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>

<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#F5F4F1;
  --surface:#FFFFFF;
  --ink:#1B2027;
  --ink-soft:#5B6570;
  --steel:#3D5A73;
  --steel-dark:#28404F;
  --accent:#F2A93B;
  --accent-dark:#D48F1E;
  --bien:#3F8F5F;
  --regular:#E0A63C;
  --mal:#C0392B;
  --na:#9AA5AD;
  --line:#E4E1DA;
  --radius:10px;
  --shadow:0 2px 10px rgba(27,32,39,.08);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
body{padding-bottom:60px;-webkit-tap-highlight-color:transparent;}
h1,h2,h3{margin:0;line-height:1.15;}
button{font-family:inherit;}
.hidden{display:none !important;}

/* ============================================================
   HEADER
   ============================================================ */
header.app-header{
  background:var(--ink);
  color:#fff;
  padding:18px 20px 16px;
  position:relative;
  overflow:hidden;
}
header.app-header::after{
  content:"";
  position:absolute; left:0; right:0; bottom:0;
  height:4px;
  background:repeating-linear-gradient(135deg,var(--accent) 0 10px,var(--accent-dark) 10px 20px);
}
header.app-header .eyebrow{
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);font-weight:700;margin-bottom:2px;
}
header.app-header h1{font-size:20px;font-weight:800;}
header.app-header .user-line{
  margin-top:8px;font-size:13px;color:#C9CFD4;
  display:flex;align-items:center;gap:6px;
}
header.app-header .user-line .dot{
  width:7px;height:7px;border-radius:50%;background:var(--bien);flex:none;
}

/* ============================================================
   LAYOUT
   ============================================================ */
main{max-width:640px;margin:0 auto;padding:16px;}
.card{
  background:var(--surface);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:18px;
  margin-bottom:14px;
}
.card h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--steel-dark);margin-bottom:12px;}
.field{margin-bottom:14px;}
.field:last-child{margin-bottom:0;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
.field input[type=text],
.field input[type=number],
.field input[type=datetime-local],
.field select,
.field textarea{
  width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;
  font-size:15px;color:var(--ink);background:#fff;
}
.field textarea{min-height:70px;resize:vertical;font-family:inherit;}
.field .readonly-box{
  background:#F7F6F3;border:1.5px dashed var(--line);border-radius:8px;
  padding:10px 12px;font-size:13.5px;color:var(--ink-soft);min-height:20px;
}

/* segmented controls */
.segmented{display:flex;gap:6px;flex-wrap:wrap;}
.segmented button{
  flex:1 1 auto;min-width:64px;
  border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);
  padding:10px 6px;border-radius:8px;font-size:13.5px;font-weight:700;
  cursor:pointer;transition:.12s;
}
.segmented button.active{color:#fff;border-color:transparent;}
.segmented.linea button.active,.segmented.etapa button.active{background:var(--steel);}

/* checklist item */
.checklist-item{border-top:1px solid var(--line);padding:14px 0;}
.checklist-item:first-of-type{border-top:none;padding-top:0;}
.checklist-item .n{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;background:var(--steel);color:#fff;
  font-size:12px;font-weight:800;margin-right:8px;flex:none;
}
.checklist-item .desc{font-size:14.5px;font-weight:600;display:flex;align-items:flex-start;margin-bottom:10px;}
.rating{display:flex;gap:6px;}
.rating button{
  flex:1;padding:10px 4px;border-radius:8px;border:1.5px solid var(--line);
  background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);
}
.rating button[data-val="1"].active{background:var(--bien);border-color:var(--bien);color:#fff;}
.rating button[data-val="2"].active{background:var(--regular);border-color:var(--regular);color:#fff;}
.rating button[data-val="3"].active{background:var(--mal);border-color:var(--mal);color:#fff;}
.rating button[data-val="4"].active{background:var(--na);border-color:var(--na);color:#fff;}

/* nivel aplicacion */
.nivel-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);}
.nivel-row:first-of-type{border-top:none;}
.nivel-row .label{font-size:14px;font-weight:600;flex:1;}
.nivel-row .segmented{flex:none;width:180px;}
.nivel-row .segmented button{min-width:0;padding:8px 4px;font-size:12px;}
.nivel-row .segmented button.active{background:var(--steel);}

/* acciones correctivas */
.accion-row{
  border:1.5px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;position:relative;
}
.accion-row .quitar{
  position:absolute;top:8px;right:8px;border:none;background:none;color:var(--mal);
  font-size:18px;font-weight:800;cursor:pointer;line-height:1;padding:4px;
}
.btn-add{
  width:100%;padding:12px;border:1.5px dashed var(--steel);border-radius:8px;
  background:none;color:var(--steel-dark);font-weight:700;font-size:14px;cursor:pointer;
}

/* buttons */
.btn-primary{
  width:100%;padding:15px;border:none;border-radius:10px;background:var(--accent);
  color:var(--ink);font-weight:800;font-size:16px;cursor:pointer;box-shadow:var(--shadow);
}
.btn-primary:disabled{opacity:.5;}
.btn-secondary{
  width:100%;padding:14px;border:1.5px solid var(--steel);border-radius:10px;background:none;
  color:var(--steel-dark);font-weight:700;font-size:15px;cursor:pointer;margin-top:10px;
}

/* result screen */
.nota-gauge{
  text-align:center;padding:26px 18px;
}
.nota-gauge .num{font-size:56px;font-weight:900;line-height:1;}
.nota-gauge .lbl{font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;margin-top:6px;}

/* firma */
.firma-canvas{
  width:100%;height:150px;border:1.5px dashed var(--line);border-radius:8px;
  background:#fff;touch-action:none;display:block;margin-bottom:6px;
}
.btn-borrar-firma{
  border:none;background:none;color:var(--ink-soft);font-size:12.5px;
  text-decoration:underline;cursor:pointer;padding:2px 0;
}

/* historial */
.historial-tabla{width:100%;border-collapse:collapse;font-size:13px;}
.historial-tabla th{
  text-align:left;padding:10px 12px;background:#F7F6F3;color:var(--ink-soft);
  font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;
  border-bottom:1.5px solid var(--line);white-space:nowrap;
}
.historial-tabla td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
.historial-tabla tr:last-child td{border-bottom:none;}
.historial-tabla .col-nota{text-align:center;white-space:nowrap;}
.historial-tabla .nota-chip{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;font-weight:800;font-size:12.5px;color:#fff;
}
.historial-tabla .col-pdf{text-align:right;white-space:nowrap;}
.btn-fila-pdf{
  border:1.5px solid var(--steel);background:none;color:var(--steel-dark);
  border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;
}
.btn-fila-pdf:disabled{opacity:.5;}

/* seguimiento */
.seg-stats{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.seg-stats .stat{
  flex:1;min-width:90px;background:#fff;border:1.5px solid var(--line);border-radius:10px;
  padding:12px;text-align:center;
}
.seg-stats .stat .num{font-size:22px;font-weight:800;color:var(--ink);}
.seg-stats .stat .lbl{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;}
.seg-foco{
  background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;
  font-size:13.5px;line-height:1.5;
}
.seg-foco b{color:var(--steel-dark);}
.seg-tendencia{font-weight:800;}
.seg-tendencia.up{color:var(--bien);}
.seg-tendencia.down{color:var(--mal);}
.seg-tendencia.flat{color:var(--ink-soft);}
.seg-equipo-tabla{width:100%;border-collapse:collapse;font-size:13px;}
.seg-equipo-tabla th{
  text-align:left;padding:9px 10px;background:#F7F6F3;color:var(--ink-soft);
  font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;
  border-bottom:1.5px solid var(--line);
}
.seg-equipo-tabla td{padding:9px 10px;border-bottom:1px solid var(--line);}
.seg-equipo-tabla tr:last-child td{border-bottom:none;}
.seg-equipo-tabla tr.foco-bajo{background:#FBEDEB;}
.seg-equipo-tabla .nombre{font-weight:700;}

/* status screens */
.status-screen{text-align:center;padding:60px 24px;}
.status-screen .spinner{
  width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--steel);
  margin:0 auto 18px;animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.status-screen h2{font-size:17px;margin-bottom:8px;text-transform:none;letter-spacing:0;color:var(--ink);}
.status-screen p{font-size:14px;color:var(--ink-soft);line-height:1.5;}

@media(prefers-reduced-motion: reduce){
  .status-screen .spinner{animation:none;}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="eyebrow">Gente de la Pampa S.A.</div>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
    <h1>Auditorías 5S</h1>
    <div style="display:flex;gap:6px;">
      <button type="button" id="btn-ver-seguimiento" class="hidden" style="background:none;border:1.5px solid var(--accent);color:var(--accent);font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:20px;cursor:pointer;">Seguimiento</button>
      <button type="button" id="btn-ver-historial" class="hidden" style="background:none;border:1.5px solid var(--accent);color:var(--accent);font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:20px;cursor:pointer;">Historial</button>
    </div>
  </div>
  <div class="user-line hidden" id="user-line">
    <span class="dot"></span><span id="user-line-texto"></span>
    <button type="button" id="btn-cambiar-usuario" style="margin-left:8px;background:none;border:none;color:var(--accent);font-size:12px;font-weight:700;text-decoration:underline;cursor:pointer;padding:0;">Cambiar</button>
  </div>
</header>

<main>

  <!-- ===================== PANTALLA: CARGANDO ===================== -->
  <section id="screen-loading" class="status-screen">
    <div class="spinner"></div>
    <h2>Cargando…</h2>
    <p>Conectando con el sistema.</p>
  </section>

  <!-- ===================== PANTALLA: ERROR ===================== -->
  <section id="screen-unauthorized" class="status-screen hidden">
    <h2 id="unauth-title">No pudimos conectar</h2>
    <p id="unauth-msg"></p>
  </section>

  <!-- ===================== PANTALLA: ELEGIR USUARIO ===================== -->
  <section id="screen-selector" class="hidden">
    <div class="card">
      <h2>¿Quién sos?</h2>
      <div class="field">
        <label>Elegí tu nombre de la lista</label>
        <select id="sel-usuario"><option value="">Elegí tu nombre…</option></select>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="inp-password-usuario" placeholder="Tu contraseña">
      </div>
      <p id="selector-error" style="color:var(--mal);font-size:13px;margin:0;"></p>
    </div>
    <button type="button" class="btn-primary" id="btn-confirmar-usuario">Continuar</button>
  </section>

  <!-- ===================== PANTALLA: FORMULARIO ===================== -->
  <section id="screen-form" class="hidden">

    <div class="card">
      <h2>Datos de la ronda</h2>
      <div class="field">
        <label>Línea</label>
        <div class="segmented linea" id="sel-linea"></div>
      </div>
      <div class="field">
        <label>Etapa</label>
        <div class="segmented etapa" id="sel-etapa"></div>
      </div>
      <div class="field">
        <label>Responsable del sector</label>
        <select id="sel-responsable"><option value="">Elegí línea y etapa primero</option></select>
      </div>
      <div class="field">
        <label>Sector / equipos a auditar</label>
        <div class="readonly-box" id="txt-sector-equipos">—</div>
      </div>
      <div class="field">
        <label>Fecha y hora</label>
        <input type="datetime-local" id="inp-fecha">
      </div>
      <div class="field">
        <label>Resp. Higiene y Seguridad</label>
        <input type="text" id="inp-higiene" placeholder="Nombre (opcional)">
      </div>
      <div class="field">
        <label>Acompañantes</label>
        <input type="text" id="inp-acompanantes" placeholder="Ej: Filippi, Bogino">
      </div>
    </div>

    <div class="card">
      <h2>Ronda 5S — Requisitos mínimos</h2>
      <div id="checklist-container"></div>
    </div>

    <div class="card">
      <h2>Nivel de aplicación logrado</h2>
      <div id="nivel-container"></div>
    </div>

    <div class="card">
      <h2>Comentarios y observaciones</h2>
      <div class="field">
        <textarea id="inp-comentarios" placeholder="Observaciones generales de la ronda…"></textarea>
      </div>
    </div>

    <div class="card">
      <h2>Acciones correctivas</h2>
      <div id="acciones-container"></div>
      <button type="button" class="btn-add" id="btn-add-accion">+ Agregar acción correctiva</button>
    </div>

    <div class="card">
      <h2>Firmas</h2>
      <div class="field">
        <label>Firma del auditor</label>
        <canvas id="firma-auditor" class="firma-canvas" width="600" height="150"></canvas>
        <button type="button" class="btn-borrar-firma" data-target="firma-auditor">Borrar firma</button>
      </div>
      <div class="field">
        <label>Firma del auditado (<span id="txt-nombre-auditado">Responsable del sector</span>)</label>
        <canvas id="firma-auditado" class="firma-canvas" width="600" height="150"></canvas>
        <button type="button" class="btn-borrar-firma" data-target="firma-auditado">Borrar firma</button>
      </div>
    </div>

    <button type="button" class="btn-primary" id="btn-guardar">Guardar auditoría</button>
  </section>

  <!-- ===================== PANTALLA: HISTORIAL ===================== -->
  <section id="screen-historial" class="hidden">
    <div class="card" style="padding:14px 14px 4px;">
      <div class="segmented" id="sel-historial-linea" style="margin-bottom:10px;">
        <button type="button" data-value="Soja" class="active">Soja</button>
        <button type="button" data-value="Girasol">Girasol</button>
      </div>
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      <div id="historial-tabla-wrap"><p style="color:var(--ink-soft);font-size:14px;padding:18px;">Cargando…</p></div>
    </div>
    <button type="button" class="btn-secondary" id="btn-exportar-excel">Descargar Excel (todas las auditorías)</button>
    <button type="button" class="btn-secondary" id="btn-volver-form">Volver al formulario</button>
  </section>

  <!-- ===================== PANTALLA: SEGUIMIENTO ===================== -->
  <section id="screen-seguimiento" class="hidden">
    <div class="card" style="padding:14px;">
      <div class="segmented" id="sel-seguimiento-modo" style="margin-bottom:12px;">
        <button type="button" data-value="operario" class="active">Por operario</button>
        <button type="button" data-value="supervisor">Por supervisor</button>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label id="lbl-seguimiento-select">Elegí un operario</label>
        <select id="sel-seguimiento-objetivo"><option value="">Elegí…</option></select>
      </div>
    </div>
    <div id="seguimiento-resultado"></div>
    <button type="button" class="btn-secondary" id="btn-volver-form-2">Volver al formulario</button>
  </section>

  <!-- ===================== PANTALLA: RESULTADO ===================== -->
  <section id="screen-result" class="hidden">
    <div class="card nota-gauge">
      <div class="num" id="res-nota">–</div>
      <div class="lbl">Nota final de la auditoría</div>
    </div>
    <div class="card">
      <p id="res-detalle" style="font-size:14px;color:var(--ink-soft);line-height:1.5;margin:0;"></p>
    </div>
    <button type="button" class="btn-primary" id="btn-pdf-descargar">Descargar PDF</button>
    <button type="button" class="btn-secondary" id="btn-pdf-compartir">Compartir PDF</button>
    <button type="button" class="btn-secondary" id="btn-nueva">Nueva auditoría</button>
  </section>

</main>

async function init() {

  errorEl.textContent = '';

async function apiPost(action, data) {
  // Content-Type text/plain evita el preflight OPTIONS, que Apps Script no maneja.
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: action, data: data })
  });
  return res.json();
}

// Pad de firma táctil — funciona con mouse y con dedo (touch).
function initFirmaPad(canvasId) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#1B2027';
  let dibujando = false;
  let vacio = true;

  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
  }
  function start(e) {
    e.preventDefault();
    dibujando = true; vacio = false;
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  }
  function move(e) {
    if (!dibujando) return;
    e.preventDefault();
    const p = pos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  }
  function end() { dibujando = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', end);

  return {
    clear: () => { ctx.clearRect(0, 0, canvas.width, canvas.height); vacio = true; },
    isEmpty: () => vacio,
    toDataURL: () => canvas.toDataURL('image/png')
  };
}

function buildSegmented(containerId, options, onChange) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = opt;
    btn.dataset.value = opt;
    if (i === 0) btn.classList.add('active');
    btn.addEventListener('click', () => {
      [...el.children].forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      onChange();
    });
    el.appendChild(btn);
  });
}

   ============================================================ */
async function guardarAuditoria() {
  const linea = getSegmentedValue('sel-linea');
  const etapa = getSegmentedValue('sel-etapa');
  const responsableSel = document.getElementById('sel-responsable');
  const responsableId = responsableSel.value;

  if (!responsableId) { alert('Elegí el responsable del sector antes de guardar.'); return; }
  if (Object.keys(itemRatings).length < config.checklist.length) {
    alert('Faltan calificar ' + (config.checklist.length - Object.keys(itemRatings).length) + ' ítem(s) del checklist.');
    return;
  }

  const sector = config.sectores.find(s => String(s.ID) === String(responsableId));
  const nombreAuditado = sector ? sector.Responsable : '';

  if (firmaAuditorPad.isEmpty()) { alert('Falta la firma del auditor.'); return; }
  if (firmaAuditadoPad.isEmpty()) { alert('Falta la firma del auditado.'); return; }

  const items = config.checklist.map(item => ({
    nItem: item.N_Item,
    descripcion: item.Descripcion,
    calificacion: itemRatings[item.N_Item],
    peso: item.Peso
  }));

  const payload = {
    auditorEmail: usuario.Email,
    auditorNombre: usuario.Nombre,
    nombreAuditado: nombreAuditado,
    supervisorSector: sector ? (sector.Supervisor || '') : '',
    firmaAuditorPng: firmaAuditorPad.toDataURL(),
    firmaAuditadoPng: firmaAuditadoPad.toDataURL(),
    fechaHora: document.getElementById('inp-fecha').value,
    linea: linea,
    etapa: etapa,
    sectorTexto: sector ? sector.Sector_Equipos : '',
    responsableSector: sector ? sector.Responsable : '',
    respHigieneSeg: document.getElementById('inp-higiene').value,
    acompanantes: document.getElementById('inp-acompanantes').value,
    comentarios: document.getElementById('inp-comentarios').value,
    nivelAplicacion: {
      separar: nivelValues.separar || null,
      organizar: nivelValues.organizar || null,
      limpiar: nivelValues.limpiar || null,
      estandarizar: nivelValues.estandarizar || null,
      autodisciplina: nivelValues.autodisciplina || null
    },
    items: items,
    accionesCorrectivas: accionesRows
      .filter(r => r.descripcion.trim())
      .map(r => ({ descripcion: r.descripcion, responsable: r.responsable, plazoDias: Number(r.plazoDias) || 7 }))
  };

  const btn = document.getElementById('btn-guardar');
  btn.disabled = true; btn.textContent = 'Guardando…';

  try {
    const resp = await apiPost('nuevaAuditoria', payload);
    if (resp.error || !resp.ok) throw new Error(resp.error || 'Error desconocido al guardar.');

    lastAuditoria = { payload: payload, nota: resp.nota, auditoriaId: resp.auditoriaId, items: items, auditorNombre: usuario.Nombre };
    mostrarResultado(resp.nota);
  } catch (err) {
    alert('No se pudo guardar la auditoría: ' + err.message);
    btn.disabled = false; btn.textContent = 'Guardar auditoría';
  }
}

function mostrarResultado(nota) {
  const notaRedondeada = Math.round(nota * 10) / 10;
  const el = document.getElementById('res-nota');
  el.textContent = notaRedondeada;
  el.style.color = notaRedondeada >= 8 ? 'var(--bien)' : notaRedondeada >= 5 ? 'var(--regular)' : 'var(--mal)';

  showScreen('result');
}

async function descargarPDFHistorial(id, boton) {
  const textoOriginal = boton.textContent;
  boton.disabled = true; boton.textContent = '...';
  try {
    const res = await fetch(API_URL + '?action=detalle&id=' + encodeURIComponent(id) + '&_=' + Date.now());
    const detalle = await res.json();
    if (detalle.error) throw new Error(detalle.error);
    const { doc, filename } = construirPDF(detalle);
    const blob = doc.output('blob');
    const url = URL.createObjectURL(blob);
    const ventana = window.open(url, '_blank');
    if (!ventana) doc.save(filename);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (err) {
    alert('No se pudo generar el PDF de esta auditoría: ' + err.message);
  } finally {
    boton.disabled = false; boton.textContent = textoOriginal;
  }
}

function exportarExcel() {
  if (!historialRegistros.length) { alert('No hay auditorías cargadas todavía. Entrá al historial primero.'); return; }
  const filas = historialRegistros.map(r => ({
    Fecha: r.Fecha_Hora ? new Date(r.Fecha_Hora).toLocaleString('es-AR') : '',
    Línea: r.Linea, Etapa: r.Etapa,
    Responsable: r.Responsable_Sector, Supervisor: r.Supervisor_Sector || '',
    Auditor: r.Auditor_Nombre, Nota: Math.round(Number(r.Nota_Final) * 10) / 10,
    Separar: r.Nivel_Separar, Organizar: r.Nivel_Organizar, Limpiar: r.Nivel_Limpiar,
    Estandarizar: r.Nivel_Estandarizar, Autodisciplina: r.Nivel_Autodisciplina,
    'Resp. H&S': r.Resp_HigieneSeg, Acompañantes: r.Acompanantes, Comentarios: r.Comentarios
  }));
  const ws = XLSX.utils.json_to_sheet(filas);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Auditorias 5S');
  XLSX.writeFile(wb, 'Auditorias_5S_' + new Date().toISOString().slice(0, 10) + '.xlsx');
}

function nivelColumnName(key) {
  return 'Nivel_' + key.charAt(0).toUpperCase() + key.slice(1);

function colorCssPorNota(nota) {
  const c = colorPorNota(nota);
  return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
}

// Compara el promedio de la primera mitad de las notas contra la segunda
// mitad, para estimar si la tendencia es de mejora, empeoramiento o estable.
function calcularTendencia(notas) {
  if (notas.length < 2) return { dir: 'flat', texto: 'Sin datos suficientes' };
  const mitad = Math.max(Math.floor(notas.length / 2), 1);
  const primera = notas.slice(0, mitad);
  const segunda = notas.slice(notas.length - mitad);
  const prom = arr => arr.reduce((a, b) => a + b, 0) / arr.length;
  const diff = prom(segunda) - prom(primera);
  if (Math.abs(diff) < 0.3) return { dir: 'flat', texto: 'Estable' };
  return diff > 0 ? { dir: 'up', texto: 'Mejorando' } : { dir: 'down', texto: 'Empeorando' };
}

    opciones = [...new Set(config.sectores.map(s => s.Supervisor))].filter(Boolean).sort();
  }
  sel.innerHTML = '<option value="">Elegí…</option>' + opciones.map(n => '<option value="' + n + '">' + n + '</option>').join('');
}

function renderSeguimientoOperario(nombre) {
  const cont = document.getElementById('seguimiento-resultado');
  const registros = historialRegistros
    .filter(r => r.Responsable_Sector === nombre)
    .sort((a, b) => new Date(a.Fecha_Hora) - new Date(b.Fecha_Hora));

  if (!registros.length) {
    cont.innerHTML = '<p style="color:var(--ink-soft);font-size:14px;padding:14px;">Todavía no hay auditorías registradas para ' + nombre + '.</p>';
    return;
  }

  const notas = registros.map(r => Math.round(Number(r.Nota_Final) * 10) / 10);
  const labels = registros.map(r => new Date(r.Fecha_Hora).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }));
  const promedio = Math.round((notas.reduce((a, b) => a + b, 0) / notas.length) * 10) / 10;
  const ultima = notas[notas.length - 1];
  const tendencia = calcularTendencia(notas);
  const flecha = tendencia.dir === 'up' ? '↑' : tendencia.dir === 'down' ? '↓' : '→';

  const nivelesProm = NIVEL_COMPONENTES.map(c => {
    const col = nivelColumnName(c.key);
    const vals = registros.map(r => Number(r[col])).filter(v => v > 0);
    return { label: c.label, prom: vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null };
  }).filter(n => n.prom !== null);

  let focoTexto = 'Todavía no hay datos de nivel de aplicación para calcular un foco.';
  if (nivelesProm.length) {
    nivelesProm.sort((a, b) => a.prom - b.prom);
    const peor = nivelesProm[0];
    focoTexto = 'El componente con nivel más bajo es <b>' + peor.label + '</b> (promedio ' + peor.prom.toFixed(1) + ' de 4) — es donde más conviene reforzar.';
  }

  cont.innerHTML =
    '<div class="seg-stats">' +
      '<div class="stat"><div class="num">' + registros.length + '</div><div class="lbl">Auditorías</div></div>' +
      '<div class="stat"><div class="num">' + promedio + '</div><div class="lbl">Promedio</div></div>' +
      '<div class="stat"><div class="num">' + ultima + '</div><div class="lbl">Última</div></div>' +
      '<div class="stat"><div class="num seg-tendencia ' + tendencia.dir + '">' + flecha + '</div><div class="lbl">' + tendencia.texto + '</div></div>' +
    '</div>' +
    '<div class="card"><canvas id="seg-chart" height="180"></canvas></div>' +
    '<div class="seg-foco">🎯 <b>Foco sugerido:</b> ' + focoTexto + '</div>';

  renderGraficoLinea('seg-chart', labels, notas, colorCssPorNota(promedio));
}

function renderSeguimientoSupervisor(nombreSupervisor) {
  const cont = document.getElementById('seguimiento-resultado');
  const operarios = [...new Set(config.sectores.filter(s => s.Supervisor === nombreSupervisor).map(s => s.Responsable))];

  if (!operarios.length) {
    cont.innerHTML = '<p style="color:var(--ink-soft);font-size:14px;padding:14px;">No hay operarios asignados a ' + nombreSupervisor + ' en Config_Sectores.</p>';
    return;
  }

  const registrosEquipo = historialRegistros
    .filter(r => operarios.includes(r.Responsable_Sector))
    .sort((a, b) => new Date(a.Fecha_Hora) - new Date(b.Fecha_Hora));

  const filasOperarios = operarios.map(nombre => {
    const regs = historialRegistros
      .filter(r => r.Responsable_Sector === nombre)
      .sort((a, b) => new Date(a.Fecha_Hora) - new Date(b.Fecha_Hora));
    const notas = regs.map(r => Math.round(Number(r.Nota_Final) * 10) / 10);
    const promedio = notas.length ? Math.round((notas.reduce((a, b) => a + b, 0) / notas.length) * 10) / 10 : null;
    return {
      nombre: nombre, cantidad: regs.length,
      promedio: promedio, ultima: notas.length ? notas[notas.length - 1] : null,
      tendencia: notas.length >= 2 ? calcularTendencia(notas) : null
    };
  });

  filasOperarios.sort((a, b) => {
    if (a.promedio === null && b.promedio === null) return 0;
    if (a.promedio === null) return 1;
    if (b.promedio === null) return -1;
    return a.promedio - b.promedio;
  });

  const conDatos = filasOperarios.filter(f => f.promedio !== null);
  const promedioEquipo = conDatos.length ? Math.round((conDatos.reduce((a, f) => a + f.promedio, 0) / conDatos.length) * 10) / 10 : null;

  let html = '<div class="seg-stats">' +
    '<div class="stat"><div class="num">' + registrosEquipo.length + '</div><div class="lbl">Auditorías del equipo</div></div>' +
    '<div class="stat"><div class="num">' + (promedioEquipo !== null ? promedioEquipo : '—') + '</div><div class="lbl">Promedio equipo</div></div>' +
    '<div class="stat"><div class="num">' + operarios.length + '</div><div class="lbl">Operarios</div></div>' +
  '</div>';

  if (registrosEquipo.length) html += '<div class="card"><canvas id="seg-chart" height="180"></canvas></div>';

  if (conDatos.length) {
    const peor = conDatos[0];
    const enBaja = peor.tendencia && peor.tendencia.dir === 'down';
    html += '<div class="seg-foco">🎯 <b>Con quién conviene hablar primero:</b> ' + peor.nombre +
      ' — promedio ' + peor.promedio + '/10' + (enBaja ? ' y en baja' : '') + '.</div>';
  }

  html += '<div class="card" style="padding:0;overflow:hidden;"><div style="overflow-x:auto;"><table class="seg-equipo-tabla"><thead><tr>' +
    '<th>Operario</th><th>Auditorías</th><th>Promedio</th><th>Última</th><th>Tendencia</th>' +
    '</tr></thead><tbody>';
  filasOperarios.forEach(f => {
    const esBajo = f.promedio !== null && f.promedio < 5;
    const tendTexto = f.tendencia
      ? '<span class="seg-tendencia ' + f.tendencia.dir + '">' + (f.tendencia.dir === 'up' ? '↑ Mejorando' : f.tendencia.dir === 'down' ? '↓ Empeorando' : '→ Estable') + '</span>'
      : (f.cantidad ? '—' : 'Sin auditorías');
    html += '<tr class="' + (esBajo ? 'foco-bajo' : '') + '">' +
      '<td class="nombre">' + f.nombre + '</td>' +
      '<td>' + f.cantidad + '</td>' +
      '<td>' + (f.promedio !== null ? f.promedio : '—') + '</td>' +
      '<td>' + (f.ultima !== null ? f.ultima : '—') + '</td>' +
      '<td>' + tendTexto + '</td>' +
      '</tr>';
  });
  html += '</tbody></table></div></div>';

  cont.innerHTML = html;

  if (registrosEquipo.length) {
    const labels = registrosEquipo.map(r => new Date(r.Fecha_Hora).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }));
    const notas = registrosEquipo.map(r => Math.round(Number(r.Nota_Final) * 10) / 10);
    renderGraficoLinea('seg-chart', labels, notas, colorCssPorNota(promedioEquipo !== null ? promedioEquipo : 5));
  }
}

/* ============================================================
   CONSTRUIR / DESCARGAR / COMPARTIR PDF
   ============================================================ */

function colorPorNota(nota) {
  if (nota >= 8) return [63, 143, 95];
  if (nota >= 5) return [224, 166, 60];
  return [192, 57, 43];
}

function pdfDivisor(doc, y) {
  doc.setDrawColor(228, 225, 218);
  doc.setLineWidth(0.3);
  doc.line(14, y, 196, y);
}

function pdfTituloSeccion(doc, y, texto) {
  doc.setFillColor(61, 90, 115);
  doc.rect(14, y - 3.2, 2.2, 4.2, 'F');
  doc.setFont(undefined, 'bold');
  doc.setFontSize(10.5);
  doc.setTextColor(27, 32, 39);
  doc.text(texto, 18, y);
}

function construirPDF(auditoria) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const p = auditoria.payload;
  const nota = Math.round(auditoria.nota * 10) / 10;
  const colorNota = colorPorNota(nota);
  const grisFondo = [247, 246, 243];

  // ---------- Membrete ----------
  try { doc.addImage(LOGO_BASE64, 'PNG', 14, 12, 52, 12.3); } catch (e) {}

  doc.setFillColor(colorNota[0], colorNota[1], colorNota[2]);
  doc.roundedRect(146, 10, 50, 22, 2.5, 2.5, 'F');
  doc.setTextColor(255, 255, 255);
  doc.setFont(undefined, 'bold');
  doc.setFontSize(8.5);
  doc.text('PUNTAJE', 171, 17, { align: 'center' });
  doc.setFontSize(19);
  doc.text(nota + '/10', 171, 27, { align: 'center' });

  doc.setFillColor(61, 90, 115);
  doc.rect(14, 30, 182, 1.1, 'F');

  doc.setTextColor(27, 32, 39);
  doc.setFont(undefined, 'bold');
  doc.setFontSize(15);
  doc.text('Auditoría 5S', 14, 41);
  doc.setFont(undefined, 'normal');
  doc.setFontSize(10);
  doc.setTextColor(91, 101, 112);
  doc.text(p.etapa + ' — ' + p.linea, 14, 47);

  let y = 55;

  // ---------- Grilla de datos ----------
  const estiloEtiqueta = { fontStyle: 'bold', fillColor: grisFondo, textColor: [40, 64, 79], cellWidth: 40 };
  doc.autoTable({
    startY: y,
    body: [
      ['RESPONSABLE', p.responsableSector || '-', 'SUPERVISOR', p.supervisorSector || '-'],
      ['AUDITOR', auditoria.auditorNombre || '-', 'FECHA', (p.fechaHora || '').replace('T', '  ')]
    ],
    theme: 'grid',
    styles: { fontSize: 9.5, cellPadding: 3.2, lineColor: [228, 225, 218], lineWidth: 0.3 },
    columnStyles: { 0: estiloEtiqueta, 2: estiloEtiqueta }
  });
  y = doc.lastAutoTable.finalY;

  doc.autoTable({
    startY: y,
    body: [['SECTOR / EQUIPOS', p.sectorTexto || '-']],
    theme: 'grid',
    styles: { fontSize: 9.5, cellPadding: 3.2, lineColor: [228, 225, 218], lineWidth: 0.3 },
    columnStyles: { 0: { fontStyle: 'bold', fillColor: grisFondo, textColor: [40, 64, 79], cellWidth: 40 } }
  });
  y = doc.lastAutoTable.finalY;

  doc.autoTable({
    startY: y,
    body: [['RESP. H&S', p.respHigieneSeg || '-', 'ACOMPAÑANTES', p.acompanantes || '-']],
    theme: 'grid',
    styles: { fontSize: 9.5, cellPadding: 3.2, lineColor: [228, 225, 218], lineWidth: 0.3 },
    columnStyles: { 0: estiloEtiqueta, 2: estiloEtiqueta }
  });
  y = doc.lastAutoTable.finalY + 10;

  // ---------- Checklist ----------
  pdfTituloSeccion(doc, y, 'Ronda 5S');
  y += 5;
  doc.autoTable({
    startY: y,
    head: [['#', 'Ítem', 'Resultado']],
    body: auditoria.items.map(it => [it.nItem, it.descripcion, RATING_LABELS[it.calificacion]]),
    theme: 'grid',
    styles: { fontSize: 9, cellPadding: 3, lineColor: [228, 225, 218], lineWidth: 0.3 },
    headStyles: { fillColor: [40, 64, 79], textColor: [255, 255, 255] },
    columnStyles: { 0: { cellWidth: 10, halign: 'center' }, 2: { cellWidth: 26, halign: 'center' } }
  });
  y = doc.lastAutoTable.finalY + 10;

  // ---------- Nivel de aplicación (en filas, no en columnas) ----------
  if (y > 240) { doc.addPage(); y = 20; }
  pdfTituloSeccion(doc, y, 'Nivel de aplicación logrado');
  y += 5;
  doc.autoTable({
    startY: y,
    body: NIVEL_COMPONENTES.map(c => {
      const v = p.nivelAplicacion[c.key];
      return [c.label.toUpperCase(), v ? LEVEL_LABELS[v - 1] : '—'];
    }),
    theme: 'grid',
    styles: { fontSize: 9.5, cellPadding: 3, lineColor: [228, 225, 218], lineWidth: 0.3 },
    columnStyles: { 0: { fontStyle: 'bold', fillColor: grisFondo, textColor: [40, 64, 79], cellWidth: 40 } }
  });
  y = doc.lastAutoTable.finalY + 10;

  // ---------- Comentarios ----------
  if (p.comentarios) {
    if (y > 255) { doc.addPage(); y = 20; }
    pdfTituloSeccion(doc, y, 'Comentarios y observaciones');
    y += 6;
    doc.setFont(undefined, 'normal');
    doc.setFontSize(9.5);
    doc.setTextColor(27, 32, 39);
    const split = doc.splitTextToSize(p.comentarios, 180);
    doc.text(split, 14, y);
    y += split.length * 4.6 + 8;
  }

  // ---------- Acciones correctivas ----------
  if (p.accionesCorrectivas && p.accionesCorrectivas.length) {
    if (y > 250) { doc.addPage(); y = 20; }
    pdfTituloSeccion(doc, y, 'Acciones correctivas');
    y += 5;
    doc.autoTable({
      startY: y,
      head: [['Descripción', 'Responsable', 'Plazo']],
      body: p.accionesCorrectivas.map(a => [a.descripcion, a.responsable, a.plazoDias + ' días']),
      theme: 'grid',
      styles: { fontSize: 9, cellPadding: 3, lineColor: [228, 225, 218], lineWidth: 0.3 },
      headStyles: { fillColor: [40, 64, 79], textColor: [255, 255, 255] }
    });
    y = doc.lastAutoTable.finalY + 10;
  }

  // ---------- Firmas ----------
  if (y > 235) { doc.addPage(); y = 20; }
  pdfDivisor(doc, y - 4);
  pdfTituloSeccion(doc, y, 'Firmas');
  y += 6;
  try {
    if (p.firmaAuditorPng) doc.addImage(p.firmaAuditorPng, 'PNG', 14, y, 82, 22);
    if (p.firmaAuditadoPng) doc.addImage(p.firmaAuditadoPng, 'PNG', 104, y, 82, 22);
  } catch (e) {}
  y += 24;
  doc.setDrawColor(150, 150, 150);
  doc.setLineWidth(0.2);
  doc.line(14, y, 96, y);
  doc.line(104, y, 186, y);
  doc.setFont(undefined, 'bold');
  doc.setFontSize(9);
  doc.setTextColor(27, 32, 39);
  doc.text('Auditor', 14, y + 5);
  doc.text('Auditado', 104, y + 5);
  doc.setFont(undefined, 'normal');
  doc.setFontSize(8.5);
  doc.setTextColor(91, 101, 112);
  doc.text(auditoria.auditorNombre || '-', 14, y + 10);
  doc.text(p.responsableSector || '-', 104, y + 10);

  // ---------- Pie ----------
  const paginas = doc.internal.getNumberOfPages();
  for (let i = 1; i <= paginas; i++) {
    doc.setPage(i);
    doc.setFontSize(7.5);
    doc.setTextColor(150, 150, 150);
    doc.text('Gente de la Pampa S.A. · Sistema de Auditorías 5S', 14, 290);
    doc.text('Página ' + i + ' de ' + paginas, 196, 290, { align: 'right' });
  }

  const filename = 'Auditoria_5S_' + (p.responsableSector || 'sd').replace(/\s+/g, '_') + '_' + (p.fechaHora || '').slice(0, 10) + '.pdf';
  return { doc: doc, filename: filename };
}

function descargarPDF(auditoria) {
  const { doc, filename } = construirPDF(auditoria);
  const blob = doc.output('blob');
  const url = URL.createObjectURL(blob);
  const ventana = window.open(url, '_blank');
  if (!ventana) {
    // si el navegador bloqueó la pestaña emergente, hacemos la descarga directa como respaldo
    doc.save(filename);
  }
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

async function compartirPDF(auditoria) {
  const { doc, filename } = construirPDF(auditoria);
  const blob = doc.output('blob');
  const file = new File([blob], filename, { type: 'application/pdf' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'Auditoría 5S', text: 'Resultado de la auditoría 5S' });
      return;
    } catch (e) { /* el usuario canceló el share */ }
  } else {
    doc.save(filename);
  }
}
